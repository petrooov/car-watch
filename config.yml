interval_minutes: 30
request_timeout_seconds: 25
user_agent: "CarWatch/0.2 (+personal listing monitor; respectful polling)"

telegram:
  enabled: true
  recipients:
    - name: hlavni-chat
      bot_token_env: TELEGRAM_BOT_TOKEN
      chat_id_env: TELEGRAM_CHAT_ID
    - name: druhy-chat
      bot_token_env: TELEGRAM_BOT_TOKEN_2
      chat_id_env: TELEGRAM_CHAT_ID_2
      optional: true

notifications:
  new_listings: true
  price_changes: false

ai:
  enabled: true
  api_key_env: OPENAI_API_KEY
  model: gpt-5-mini
  max_detail_chars: 14000
  # --send-all nejdřív vezme 50 nejlepších podle levného fallback score,
  # nechá je detailně ohodnotit AI a do Telegramu pošle top 20.
  send_all_candidate_limit: 50
  send_all_top_n: 20

# Tvrdé limity + ideál pro scoring.
filters:
  excluded_fuels: ["nafta", "diesel"]
  excluded_transmissions: ["manuální", "manuál", "manual"]
  max_price: 550000
  min_year: 2019
  max_mileage_km: 130000
  ideal_year: 2020
  ideal_mileage_km: 100000
  ideal_price: 500000

# Whitelist modelů. Starší premium auta mají vlastní výjimku.
vehicle_rules:
  "Toyota RAV4":
    aliases: ["Toyota RAV4", "Toyota Rav 4", "RAV4"]
    bonus: 4
  "Mazda CX-5":
    aliases: ["Mazda CX-5", "Mazda CX 5"]
    bonus: 3
  "Honda CR-V":
    aliases: ["Honda CR-V", "Honda CR V"]
    bonus: 4
  "Mitsubishi Outlander":
    aliases: ["Mitsubishi Outlander"]
    bonus: 4
  "Hyundai Santa Fe":
    aliases: ["Hyundai Santa Fe", "Hyundai SantaFe", "Hyundai Santa-Fe"]
  "Kia Sorento":
    aliases: ["Kia Sorento"]
  "Hyundai Tucson":
    aliases: ["Hyundai Tucson"]
  "Ford Kuga":
    aliases: ["Ford Kuga"]
  "Kia Sportage":
    aliases: ["Kia Sportage"]
  "Peugeot 5008":
    aliases: ["Peugeot 5008"]
  "Volkswagen Tiguan":
    aliases: ["Volkswagen Tiguan", "VW Tiguan"]
  "Škoda Kodiaq":
    aliases: ["Škoda Kodiaq", "Skoda Kodiaq"]
  "Renault Koleos":
    aliases: ["Renault Koleos"]
  "Nissan X-Trail":
    aliases: ["Nissan X-Trail", "Nissan X Trail"]
  "Subaru Forester":
    aliases: ["Subaru Forester"]
  "Volvo XC60":
    aliases: ["Volvo XC60", "Volvo XC 60"]
    min_year: 2018
    max_mileage_km: 140000
    ideal_year: 2020
    bonus: 2
  "Lexus NX":
    aliases: ["Lexus NX", "Lexus NX 300h", "Lexus NX300h"]
    min_year: 2018
    max_mileage_km: 140000
    ideal_year: 2020
    bonus: 2

