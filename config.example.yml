  - {name: "Toyota RAV4", source: carvago, url: "https://carvago.com/cs/auta/toyota/rav4?price-to=550000&registration-date-from=2019&mileage-to=130000&transmission[]=TRANSMISSION_AUTOMATIC&sort=publish-date&direction=desc&limit=20&page=1", enabled: false}
