  - {name: "Volkswagen Tiguan", source: sauto, url: "https://www.sauto.cz/inzerce/osobni/volkswagen/tiguan?cena-do=550000&vyrobeno-od=2018", enabled: true}
  - {name: "Škoda Kodiaq", source: sauto, url: "https://www.sauto.cz/inzerce/osobni/skoda/kodiaq?cena-do=550000&vyrobeno-od=2018", enabled: true}
